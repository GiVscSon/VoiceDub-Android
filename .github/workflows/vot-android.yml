name: Android local models and VOT transport
on:
  pull_request:
    branches: [main]
    paths: ['app/**', 'vot-runtime/**', '.github/workflows/vot-android.yml']
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  android-vot:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        profile: [pixel_2, pixel_c]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare pinned local model and speech samples
        run: python3 scripts/fetch_tiny_lid.py --destination app/src/androidTest/assets/lid
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: ${{ matrix.profile }}
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 2048
          script: |
            gradle --no-daemon :app:connectedTinyDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.voicedub.app.VotUploadTest,com.voicedub.app.LocalTranslationTest,com.voicedub.app.TinyLanguageTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vot-android-${{ matrix.profile }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/

name: Build VoiceDub Android APK
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static Android project preflight
        run: python3 scripts/check_project.py
      - name: Voice server tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Build pinned VOT runtime from source
        run: |
          npm ci --prefix vot-runtime
          npm run build --prefix vot-runtime
          git diff --exit-code -- app/src/main/assets/vot_engine.js
      - name: Browser module checks
        run: |
          node --check app/src/main/assets/vot_engine.js
          node --check app/src/main/assets/browser_probe.js
          node --check app/src/main/assets/browser_dubbing.js
          node --check app/src/main/assets/browser_captions.js
          node --test tests/*.test.cjs
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Kotlin JVM tests and signed debug APK
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug
      - name: Verify APK signature and package
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk > apk-badging.txt
          python3 -c 'assert "com.voicedub.app.preview" in open("apk-badging.txt").read()'
          sha256sum app/build/outputs/apk/debug/app-debug.apk
      - name: Package PC voice server
        run: python3 -c 'import pathlib,zipfile; z=zipfile.ZipFile("VoiceDub-PC-server-v0.5.0.zip","w",zipfile.ZIP_DEFLATED); [z.write(p,p.name) for p in pathlib.Path("companion").iterdir() if p.is_file()]; z.close()'
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VoiceDub-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload PC server kit
        uses: actions/upload-artifact@v4
        with:
          name: VoiceDub-PC-server
          path: VoiceDub-PC-server-v0.5.0.zip
          if-no-files-found: error
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-unit-test-results
          path: app/build/test-results/testDebugUnitTest/

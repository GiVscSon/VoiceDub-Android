name: Voice preservation model experiment
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/voice-model-experiment.yml'
permissions:
  contents: read
jobs:
  moss-onnx:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test benchmark harness
        run: python -m unittest discover -s tests -p test_benchmark_moss.py -v
      - name: Fetch pinned upstream MOSS-TTS-Nano
        run: |
          git clone https://github.com/OpenMOSS/MOSS-TTS-Nano.git "$RUNNER_TEMP/moss"
          git -C "$RUNNER_TEMP/moss" checkout 8b7bcc9341b3b4ef3a3a58ba1338a7d85ff133eb
      - name: Install CPU dependencies
        run: |
          python -m pip install torch==2.7.0 torchaudio==2.7.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r "$RUNNER_TEMP/moss/requirements.txt" huggingface_hub
      - name: Run real voice-clone synthesis
        run: |
          mkdir -p experiment-results
          python scripts/benchmark_moss_voice.py --moss-dir "$RUNNER_TEMP/moss" --reference "$RUNNER_TEMP/moss/assets/audio/en_2.wav" --text "Здравствуйте, это проверка перевода с сохранением голоса." --output experiment-results/moss-voice-test.wav --timeout 1200 | tee experiment-results/metrics.json
      - name: Upload test WAV and metrics
        uses: actions/upload-artifact@v4
        with:
          name: voice-preservation-experiment
          path: experiment-results/
          if-no-files-found: error

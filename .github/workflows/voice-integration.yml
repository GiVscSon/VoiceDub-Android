name: Voice model and Android integration
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'companion/**'
      - 'scripts/smoke_voice_server_real.py'
      - 'tests/test_voice_server.py'
      - '.github/workflows/voice-integration.yml'
permissions:
  contents: read
jobs:
  model-http:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Server and benchmark tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Fetch pinned model runtime
        run: |
          git clone https://github.com/OpenMOSS/MOSS-TTS-Nano.git "$RUNNER_TEMP/moss"
          git -C "$RUNNER_TEMP/moss" checkout 8b7bcc9341b3b4ef3a3a58ba1338a7d85ff133eb
      - name: Install CPU dependencies
        run: |
          python -m pip install torch==2.7.0 torchaudio==2.7.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r "$RUNNER_TEMP/moss/requirements.txt" huggingface_hub
      - name: Real model through HTTP, two warm requests
        run: python scripts/smoke_voice_server_real.py --moss-dir "$RUNNER_TEMP/moss" --output-dir experiment-results
      - uses: actions/upload-artifact@v4
        with:
          name: voice-http-experiment
          path: experiment-results/
          if-no-files-found: error
  android-emulator:
    needs: model-http
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        profile: [pixel_2, pixel_c]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: actions/download-artifact@v4
        with:
          name: voice-http-experiment
          path: experiment-results
      - name: Prepare transport fixture
        run: |
          mkdir -p app/src/androidTest/assets
          cp experiment-results/reference-16k.wav app/src/androidTest/assets/
          python3 tests/serve_audio_fixture.py experiment-results/http-cloned-voice-1.wav > "$RUNNER_TEMP/fixture.log" 2>&1 &
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 15 HTTP client, WAV playback, portrait and landscape
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: ${{ matrix.profile }}
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 2048
          script: gradle --no-daemon :app:connectedCoreDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.voicedub.app.VoiceFlowTest -Pandroid.testInstrumentationRunnerArguments.voiceEndpoint=http://10.0.2.2:8765
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-emulator-results-${{ matrix.profile }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
